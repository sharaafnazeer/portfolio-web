<?xml version="1.0" encoding="UTF-8"?>
<!--
  Primary site favicon. Mirrors the brand mark used in the navbar and footer
  (a filled circle with a serif italic "S" inside). The embedded <style>
  block uses prefers-color-scheme so the favicon flips polarity when the
  browser/OS chrome is in dark mode, keeping it readable against either tab
  background. Next.js auto-emits a <link rel="icon" type="image/svg+xml"> tag
  pointing at this file (App Router file convention).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sharaaf Nazeer">
  <style>
    .bg { fill: #0a0a0a; }
    .fg { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #fafafa; }
      .fg { fill: #0a0a0a; }
    }
  </style>
  <circle class="bg" cx="16" cy="16" r="16" />
  <text
    class="fg"
    x="16"
    y="16.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Iowan Old Style', 'Apple Garamond', Baskerville, Georgia, 'Times New Roman', Times, serif"
    font-style="italic"
    font-size="22"
    font-weight="500"
  >S</text>
</svg>
